<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Meine Müslis</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#3F5A2E}a:hover{color:#2C4120}
@keyframes pop{0%{opacity:0;transform:scale(.92) translateY(10px)}100%{opacity:1;transform:none}}
.card{animation:pop .42s cubic-bezier(.2,.9,.3,1.2) both}
.press{transition:transform .15s ease,background-color .2s ease,color .2s ease}
.press:active{transform:scale(.95)}
@media (prefers-reduced-motion: reduce){.card{animation:none}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F4F3EF; color: #1C1C1A; font-family: 'Manrope', system-ui, sans-serif; display: flex; flex-direction: column">
  <div style="flex: 1; display: flex; flex-direction: column; padding: 56px 16px 16px; gap: 14px; overflow-y: auto">
    <div style="display: flex; justify-content: space-between; align-items: flex-end; padding: 0 4px">
      <div style="display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 13px; color: #6A6964">{{countLabel}}</span>
        <h1 style="margin: 0; font-size: 26px; font-weight: 700; letter-spacing: -0.01em">Meine Müslis</h1>
      </div>
      <div style="display: flex; background: #FFFFFF; border-radius: 20px; padding: 4px">
        <sc-for list="{{sorts}}" as="s" hint-placeholder-count="2">
          <button class="press" onClick="{{s.pick}}" style="height: 32px; padding: 0 12px; border-radius: 16px; border: none; background: {{s.bg}}; color: {{s.fg}}; font-family: inherit; font-size: 12px; font-weight: 700">{{s.label}}</button>
        </sc-for>
      </div>
    </div>

    <sc-for list="{{list}}" as="m" hint-placeholder-count="3">
      <div class="card" style="background: #FFFFFF; border-radius: 24px; padding: 16px; display: flex; flex-direction: column; gap: 12px">
        <a href="MuesliDetail.dc.html" style="display: flex; flex-direction: column; gap: 12px; text-decoration: none; color: #1C1C1A">
          <div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 12px">
            <div style="display: flex; flex-direction: column; gap: 2px">
              <span style="font-size: 18px; font-weight: 700">{{m.name}}</span>
              <span style="font-size: 13px; color: #6A6964">{{m.meta}}</span>
            </div>
            <span style="font-size: 18px; font-weight: 800; font-variant-numeric: tabular-nums; white-space: nowrap">{{m.total}}</span>
          </div>
          <div style="display: flex; height: 10px; gap: 3px">
            <sc-for list="{{m.parts}}" as="p" hint-placeholder-count="3">
              <span style="width: {{p.w}}%; border-radius: 5px; background: {{p.c}}"></span>
            </sc-for>
          </div>
          <span style="font-size: 13px; color: #6A6964">{{m.ingredients}}</span>
        </a>
        <div style="display: flex; justify-content: space-between; align-items: center; border-top: 1px solid #EDEBE5; padding-top: 10px">
          <span style="font-size: 12px; font-weight: 700; color: #1C1C1A">{{m.allergens}}</span>
          <button class="press" onClick="{{m.duplicate}}" style="height: 36px; padding: 0 12px; border-radius: 18px; border: none; background: #F4F3EF; font-family: inherit; font-size: 13px; font-weight: 700; color: #1C1C1A; display: flex; align-items: center; gap: 6px">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="8" y="8" width="12" height="12" rx="3"></rect><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"></path></svg>Duplizieren</button>
        </div>
      </div>
    </sc-for>
  </div>

  <div style="padding: 0 16px 24px">
    <nav style="height: 64px; border-radius: 32px; background: #1C1C1A; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); padding: 6px; box-sizing: border-box; gap: 4px">
      <a href="Zutaten.dc.html" aria-label="Zutaten" style="display: flex; align-items: center; justify-content: center; border-radius: 26px; color: #BDBAB0">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="3" width="7" height="7" rx="2"></rect><rect x="14" y="3" width="7" height="7" rx="2"></rect><rect x="3" y="14" width="7" height="7" rx="2"></rect><rect x="14" y="14" width="7" height="7" rx="2"></rect></svg></a>
      <a href="Mixen.dc.html" aria-label="Mixen" style="display: flex; align-items: center; justify-content: center; border-radius: 26px; color: #BDBAB0">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M3 11h18a9 9 0 0 1-18 0z"></path><path d="M8 7c1-2 3-2 4 0s3 2 4 0"></path></svg></a>
      <a href="Muesli.dc.html" style="display: flex; align-items: center; justify-content: center; gap: 6px; border-radius: 26px; background: #F4F3EF; color: #1C1C1A; text-decoration: none; font-size: 13px; font-weight: 700">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M8 6h13M8 12h13M8 18h13"></path><circle cx="4" cy="6" r="1"></circle><circle cx="4" cy="12" r="1"></circle><circle cx="4" cy="18" r="1"></circle></svg>Müslis</a>
      <a href="Einstellungen.dc.html" aria-label="Mehr" style="display: flex; align-items: center; justify-content: center; border-radius: 26px; color: #BDBAB0">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="5" cy="12" r="1.5"></circle><circle cx="12" cy="12" r="1.5"></circle><circle cx="19" cy="12" r="1.5"></circle></svg></a>
    </nav>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
var START = [
  { id: 1, name: 'Frühstück Basic', who: 'Für mich', date: '07.10.2026', order: 3, total: 400, ingredients: 'Haferflocken, Mandeln, Rosinen', allergens: 'Gluten · Schalenfrüchte',
    parts: [{ w: 75, c: '#3F5A2E' }, { w: 15, c: '#A7B88F' }, { w: 10, c: '#C9A97A' }] },
  { id: 2, name: 'Nussfrei', who: 'Für einen Freund', date: '02.10.2026', order: 2, total: 500, ingredients: 'Haferflocken, Rosinen, Leinsamen', allergens: 'Gluten · Spuren: Sesam',
    parts: [{ w: 70, c: '#3F5A2E' }, { w: 20, c: '#C9A97A' }, { w: 10, c: '#5E5B52' }] },
  { id: 3, name: 'Schoko-Crunch', who: 'Für mich', date: '21.09.2026', order: 1, total: 350, ingredients: 'Dinkelflocken, Kakaonibs, Kokoschips', allergens: 'Gluten · Spuren: Milch, Schalenfrüchte',
    parts: [{ w: 60, c: '#3F5A2E' }, { w: 25, c: '#5E5B52' }, { w: 15, c: '#D8C3A0' }] }
];

class Component extends DCLogic {
  constructor(props) { super(props); this.state = { list: START, sort: 'new', next: 4 }; }
  duplicate(m) {
    this.setState(function (s) {
      var copy = Object.assign({}, m, { id: s.next, name: m.name + ' (Kopie)', date: '07.10.2026', order: 100 + s.next });
      return { list: [copy].concat(s.list), next: s.next + 1 };
    });
  }
  renderVals() {
    var self = this, sort = this.state.sort;
    var list = this.state.list.slice().sort(function (a, b) { return sort === 'new' ? b.order - a.order : a.name.localeCompare(b.name, 'de'); });
    return {
      countLabel: list.length + ' gespeichert',
      sorts: [{ k: 'new', label: 'Neueste' }, { k: 'az', label: 'A–Z' }].map(function (o) {
        var on = o.k === sort;
        return { label: o.label, bg: on ? '#1C1C1A' : 'transparent', fg: on ? '#FFFFFF' : '#1C1C1A', pick: function () { self.setState({ sort: o.k }); } };
      }),
      list: list.map(function (m) {
        return {
          name: m.name, meta: m.who + ' · ' + m.date, total: m.total + ' g', ingredients: m.ingredients, allergens: m.allergens, parts: m.parts,
          duplicate: function () { self.duplicate(m); }
        };
      })
    };
  }
}
</script>
</body>
</html>
