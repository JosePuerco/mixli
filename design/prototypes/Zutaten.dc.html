<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Zutaten</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#3F5A2E}a:hover{color:#2C4120}
@keyframes pop{0%{opacity:0;transform:scale(.9) translateY(10px)}100%{opacity:1;transform:none}}
.card{animation:pop .4s cubic-bezier(.2,.9,.3,1.2) both}
.press{transition:transform .15s ease,background-color .2s ease,color .2s ease}
.press:active{transform:scale(.94)}
@media (prefers-reduced-motion: reduce){.card{animation:none}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #F4F3EF; color: #1C1C1A; font-family: 'Manrope', system-ui, sans-serif; display: flex; flex-direction: column">
  <div style="flex: 1; display: flex; flex-direction: column; padding: 56px 16px 16px; gap: 14px; overflow-y: auto">
    <div style="display: flex; justify-content: space-between; align-items: flex-end; padding: 0 4px">
      <div style="display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 13px; color: #6A6964">{{countLabel}}</span>
        <h1 style="margin: 0; font-size: 26px; font-weight: 700; letter-spacing: -0.01em">Zutaten</h1>
      </div>
    </div>

    <label style="display: flex; align-items: center; gap: 10px; height: 48px; padding: 0 16px; border-radius: 24px; background: #FFFFFF; color: #6A6964">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
      <input type="search" placeholder="Zutat suchen" aria-label="Zutat suchen" onInput="{{onSearch}}" style="flex: 1; border: none; outline: none; background: transparent; font-family: inherit; font-size: 16px; color: #1C1C1A">
    </label>

    <div style="display: flex; gap: 8px; overflow-x: auto; padding: 0 2px">
      <sc-for list="{{cats}}" as="c" hint-placeholder-count="5">
        <button class="press" onClick="{{c.pick}}" style="flex-shrink: 0; height: 36px; padding: 0 14px; border-radius: 18px; border: none; background: {{c.bg}}; color: {{c.fg}}; font-family: inherit; font-size: 13px; font-weight: 700">{{c.label}}</button>
      </sc-for>
    </div>

    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
      <sc-for list="{{items}}" as="item" hint-placeholder-count="6">
        <div class="card" style="background: #FFFFFF; border-radius: 24px; padding: 8px 8px 12px; display: flex; flex-direction: column; gap: 8px; animation-delay: {{item.delay}}ms">
          <div style="height: 104px; border-radius: 18px; background: {{item.tint}}; display: flex; align-items: center; justify-content: center; font-size: 12px; color: #6A6964">Foto</div>
          <div style="padding: 0 6px; display: flex; flex-direction: column; gap: 2px">
            <span style="font-size: 15px; font-weight: 700">{{item.name}}</span>
            <span style="font-size: 12px; color: #6A6964">{{item.meta}}</span>
          </div>
          <sc-if value="{{item.hasAllergen}}" hint-placeholder-val="{{ false }}">
            <span style="align-self: flex-start; margin-left: 6px; height: 24px; padding: 0 10px; border-radius: 12px; background: #F4F3EF; font-size: 11px; font-weight: 700; display: flex; align-items: center">{{item.allergen}}</span>
          </sc-if>
        </div>
      </sc-for>
    </div>
    <sc-if value="{{empty}}" hint-placeholder-val="{{ false }}">
      <span style="padding: 32px 16px; text-align: center; font-size: 14px; color: #6A6964">Keine Zutat gefunden.</span>
    </sc-if>
  </div>

  <a class="press" href="ZutatNeu.dc.html" aria-label="Neue Zutat" style="position: absolute; right: 20px; bottom: 108px; width: 60px; height: 60px; border-radius: 30px; background: #3F5A2E; color: #FFFFFF; display: flex; align-items: center; justify-content: center; box-shadow: 0 6px 18px rgba(28, 28, 26, 0.18)">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"></path></svg>
  </a>

  <div style="padding: 0 16px 24px">
    <nav style="height: 64px; border-radius: 32px; background: #1C1C1A; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); padding: 6px; box-sizing: border-box; gap: 4px">
      <a href="Zutaten.dc.html" style="display: flex; align-items: center; justify-content: center; gap: 6px; border-radius: 26px; background: #F4F3EF; color: #1C1C1A; text-decoration: none; font-size: 13px; font-weight: 700">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="7" rx="2"></rect><rect x="14" y="3" width="7" height="7" rx="2"></rect><rect x="3" y="14" width="7" height="7" rx="2"></rect><rect x="14" y="14" width="7" height="7" rx="2"></rect></svg>Zutaten</a>
      <a href="Mixen.dc.html" aria-label="Mixen" style="display: flex; align-items: center; justify-content: center; border-radius: 26px; color: #BDBAB0">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M3 11h18a9 9 0 0 1-18 0z"></path><path d="M8 7c1-2 3-2 4 0s3 2 4 0"></path></svg></a>
      <a href="Muesli.dc.html" aria-label="Müslis" style="display: flex; align-items: center; justify-content: center; border-radius: 26px; color: #BDBAB0">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M8 6h13M8 12h13M8 18h13"></path><circle cx="4" cy="6" r="1"></circle><circle cx="4" cy="12" r="1"></circle><circle cx="4" cy="18" r="1"></circle></svg></a>
      <a href="Einstellungen.dc.html" aria-label="Mehr" style="display: flex; align-items: center; justify-content: center; border-radius: 26px; color: #BDBAB0">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="5" cy="12" r="1.5"></circle><circle cx="12" cy="12" r="1.5"></circle><circle cx="19" cy="12" r="1.5"></circle></svg></a>
    </nav>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
var DB = [
  { name: 'Haferflocken', brand: 'Zart, Vollkorn', cat: 'Flocken', kcal: 372, allergen: 'Gluten', tint: '#E8E4D8' },
  { name: 'Dinkelflocken', brand: 'Bio', cat: 'Flocken', kcal: 360, allergen: 'Gluten', tint: '#EAE3D4' },
  { name: 'Mandeln', brand: 'ganz, naturbelassen', cat: 'Nüsse', kcal: 600, allergen: 'Schalenfrüchte', tint: '#E4E8DC' },
  { name: 'Cashewkerne', brand: 'ungesalzen', cat: 'Nüsse', kcal: 580, allergen: 'Schalenfrüchte', tint: '#ECE6D9' },
  { name: 'Leinsamen', brand: 'geschrotet', cat: 'Samen', kcal: 500, allergen: 'Spuren: Sesam', tint: '#E6E2DA' },
  { name: 'Rosinen', brand: 'ungeschwefelt', cat: 'Trockenfrüchte', kcal: 300, allergen: '', tint: '#EDE5D6' },
  { name: 'Kokoschips', brand: 'geröstet', cat: 'Extras', kcal: 660, allergen: 'Spuren: Schalenfrüchte', tint: '#F0EEE8' }
];
var CATS = ['Alle', 'Flocken', 'Nüsse', 'Samen', 'Trockenfrüchte', 'Extras'];

class Component extends DCLogic {
  constructor(props) { super(props); this.state = { cat: 'Alle', q: '' }; }
  renderVals() {
    var self = this, cat = this.state.cat, q = this.state.q.toLowerCase();
    var list = DB.filter(function (d) { return (cat === 'Alle' || d.cat === cat) && (!q || d.name.toLowerCase().indexOf(q) >= 0); });
    return {
      countLabel: DB.length + ' Zutaten',
      cats: CATS.map(function (c) {
        var on = c === cat;
        return { label: c, bg: on ? '#1C1C1A' : '#FFFFFF', fg: on ? '#FFFFFF' : '#1C1C1A', pick: function () { self.setState({ cat: c }); } };
      }),
      items: list.map(function (d, i) {
        return { name: d.name, meta: d.brand + ' · ' + d.kcal + ' kcal', tint: d.tint, allergen: d.allergen, hasAllergen: !!d.allergen, delay: i * 50 };
      }),
      empty: list.length === 0,
      onSearch: function (e) { self.setState({ q: e.target.value }); }
    };
  }
}
</script>
</body>
</html>
