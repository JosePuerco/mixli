<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Mehr – Backup und Kategorien</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#3F5A2E}a:hover{color:#2C4120}
@keyframes rowIn{0%{opacity:0;transform:translateY(-6px)}100%{opacity:1;transform:none}}
.row{animation:rowIn .3s cubic-bezier(.2,.8,.2,1) both}
.status{transition:background-color .4s ease,color .4s ease}
.press{transition:transform .15s ease,background-color .2s ease}
.press:active{transform:scale(.94)}
input::placeholder{color:#A3A099}
@media (prefers-reduced-motion: reduce){.row{animation:none}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F4F3EF; color: #1C1C1A; font-family: 'Manrope', system-ui, sans-serif; display: flex; flex-direction: column">
  <div style="flex: 1; display: flex; flex-direction: column; padding: 56px 16px 16px; gap: 14px; overflow-y: auto">
    <h1 style="margin: 0; padding: 0 4px; font-size: 26px; font-weight: 700; letter-spacing: -0.01em">Mehr</h1>

    <div style="background: #FFFFFF; border-radius: 24px; padding: 16px; display: flex; flex-direction: column; gap: 12px">
      <span style="font-size: 15px; font-weight: 700">Backup</span>
      <div class="status" style="border-radius: 16px; padding: 12px 14px; background: {{statusBg}}; display: flex; align-items: center; gap: 10px">
        <span style="width: 10px; height: 10px; border-radius: 5px; background: {{statusDot}}; flex-shrink: 0"></span>
        <span style="font-size: 14px; font-weight: 600">{{statusText}}</span>
      </div>
      <span style="font-size: 12px; color: #6A6964">Deine Daten liegen nur auf diesem Gerät. Speichere das Backup z. B. in iCloud Drive.</span>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
        <button class="press" onClick="{{doBackup}}" style="height: 48px; border-radius: 24px; border: none; background: #3F5A2E; color: #FFFFFF; font-family: inherit; font-size: 14px; font-weight: 700">Exportieren</button>
        <button class="press" style="height: 48px; border-radius: 24px; border: none; background: #F4F3EF; font-family: inherit; font-size: 14px; font-weight: 700; color: #1C1C1A">Importieren</button>
      </div>
    </div>

    <div style="background: #FFFFFF; border-radius: 24px; padding: 16px; display: flex; flex-direction: column; gap: 8px">
      <div style="display: flex; justify-content: space-between; align-items: baseline">
        <span style="font-size: 15px; font-weight: 700">Kategorien</span>
        <span style="font-size: 12px; color: #6A6964">{{catCount}}</span>
      </div>
      <div style="display: flex; flex-direction: column">
        <sc-for list="{{cats}}" as="c" hint-placeholder-count="4">
          <div class="row" style="display: flex; align-items: center; gap: 10px; height: 48px; border-bottom: 1px solid #EDEBE5">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#A3A099" stroke-width="2"><path d="M9 6h.01M15 6h.01M9 12h.01M15 12h.01M9 18h.01M15 18h.01"></path></svg>
            <span style="flex: 1; font-size: 15px; font-weight: 600">{{c.name}}</span>
            <button class="press" onClick="{{c.remove}}" aria-label="{{c.aria}}" style="width: 40px; height: 40px; border-radius: 20px; border: none; background: transparent; color: #6A6964; display: flex; align-items: center; justify-content: center">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 7h14M10 7V5h4v2M7 7l1 12h8l1-12"></path></svg></button>
          </div>
        </sc-for>
      </div>
      <div style="display: flex; gap: 8px; padding-top: 4px">
        <input type="text" placeholder="Neue Kategorie" aria-label="Neue Kategorie" value="{{draft}}" onInput="{{onDraft}}" style="flex: 1; height: 44px; padding: 0 16px; border-radius: 22px; border: none; outline: none; background: #F4F3EF; font-family: inherit; font-size: 15px; color: #1C1C1A">
        <button class="press" onClick="{{addCat}}" style="height: 44px; padding: 0 16px; border-radius: 22px; border: none; background: #1C1C1A; color: #FFFFFF; font-family: inherit; font-size: 14px; font-weight: 700">Hinzufügen</button>
      </div>
    </div>

    <div style="background: #FFFFFF; border-radius: 24px; padding: 4px 16px">
      <div style="display: flex; justify-content: space-between; align-items: center; min-height: 52px; border-bottom: 1px solid #EDEBE5">
        <span style="font-size: 15px; font-weight: 600">Etikettenformat</span>
        <span style="font-size: 14px; color: #6A6964">70 × 42,3 mm</span>
      </div>
      <div style="display: flex; justify-content: space-between; align-items: center; min-height: 52px">
        <span style="font-size: 15px; font-weight: 600">Version</span>
        <span style="font-size: 14px; color: #6A6964">Mixli 1.0</span>
      </div>
    </div>
  </div>

  <div style="padding: 0 16px 24px">
    <nav style="height: 64px; border-radius: 32px; background: #1C1C1A; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); padding: 6px; box-sizing: border-box; gap: 4px">
      <a href="Zutaten.dc.html" aria-label="Zutaten" style="display: flex; align-items: center; justify-content: center; border-radius: 26px; color: #BDBAB0">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="3" width="7" height="7" rx="2"></rect><rect x="14" y="3" width="7" height="7" rx="2"></rect><rect x="3" y="14" width="7" height="7" rx="2"></rect><rect x="14" y="14" width="7" height="7" rx="2"></rect></svg></a>
      <a href="Mixen.dc.html" aria-label="Mixen" style="display: flex; align-items: center; justify-content: center; border-radius: 26px; color: #BDBAB0">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M3 11h18a9 9 0 0 1-18 0z"></path><path d="M8 7c1-2 3-2 4 0s3 2 4 0"></path></svg></a>
      <a href="Muesli.dc.html" aria-label="Müslis" style="display: flex; align-items: center; justify-content: center; border-radius: 26px; color: #BDBAB0">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M8 6h13M8 12h13M8 18h13"></path><circle cx="4" cy="6" r="1"></circle><circle cx="4" cy="12" r="1"></circle><circle cx="4" cy="18" r="1"></circle></svg></a>
      <a href="Einstellungen.dc.html" style="display: flex; align-items: center; justify-content: center; gap: 6px; border-radius: 26px; background: #F4F3EF; color: #1C1C1A; text-decoration: none; font-size: 13px; font-weight: 700">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="5" cy="12" r="1.5"></circle><circle cx="12" cy="12" r="1.5"></circle><circle cx="19" cy="12" r="1.5"></circle></svg>Mehr</a>
    </nav>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { backedUp: false, cats: ['Flocken', 'Nüsse', 'Samen', 'Trockenfrüchte', 'Extras'], draft: '' };
  }
  renderVals() {
    var self = this, s = this.state;
    return {
      statusBg: s.backedUp ? '#E4EADC' : '#F3E6CF',
      statusDot: s.backedUp ? '#3F5A2E' : '#B5865A',
      statusText: s.backedUp ? 'Backup gerade erstellt' : 'Letztes Backup vor 16 Tagen',
      doBackup: function () { self.setState({ backedUp: true }); },
      catCount: s.cats.length + (s.cats.length === 1 ? ' Kategorie' : ' Kategorien'),
      cats: s.cats.map(function (c) {
        return { name: c, aria: c + ' löschen', remove: function () { self.setState(function (st) { return { cats: st.cats.filter(function (x) { return x !== c; }) }; }); } };
      }),
      draft: s.draft,
      onDraft: function (e) { self.setState({ draft: e.target.value }); },
      addCat: function () {
        var name = s.draft.trim();
        if (!name || s.cats.indexOf(name) >= 0) return;
        self.setState(function (st) { return { cats: st.cats.concat([name]), draft: '' }; });
      }
    };
  }
}
</script>
</body>
</html>
