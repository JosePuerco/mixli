<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Mixli-Icon im Stil der Willkommens-Schale (EmptyState.tsx): weiße Schale mit dunkler Kontur,
       grüne Wellenlinie als Häufchen, hellgrüner Bogen innen, Schatten, drei rieselnde Flocken.
       Nur Farben aus design/tokens.json. Motiv liegt im sicheren Kreis für maskierbare Icons
       (Radius 205 um die Mitte). PNGs und Startbilder: npm run icons -->
  <rect width="512" height="512" rx="112" fill="#F4F3EF"/>
  <!-- Koordinaten wie im Willkommens-Screen (Bühne 200 × 180), vergrößert; Strich ≈ 11 px -->
  <g transform="translate(46 37.6) scale(2.1)">
    <!-- Flocken -->
    <rect x="69" y="40" width="18" height="12" rx="6" transform="rotate(-20 78 46)" fill="#C9A97A"/>
    <circle cx="104" cy="30" r="7.5" fill="#A7B88F"/>
    <rect x="119" y="44.5" width="18" height="11" rx="5.5" transform="rotate(25 128 50)" fill="#D8C3A0"/>
    <!-- Schale -->
    <g transform="translate(0 60)" fill="none" stroke-width="5.2" stroke-linecap="round" stroke-linejoin="round">
      <ellipse cx="100" cy="112" rx="58" ry="6" fill="#DAD7CF" stroke="none"/>
      <path d="M20 40h160c0 38-34 66-80 66S20 78 20 40z" fill="#FFFFFF" stroke="#1C1C1A"/>
      <path d="M34 40c8-10 20-12 30-6 8-8 22-9 32-2 10-8 26-7 34 2 10-6 24-3 30 6" stroke="#3F5A2E"/>
      <path d="M44 62c10 14 30 22 56 22s46-8 56-22" stroke="#A7B88F"/>
    </g>
  </g>
</svg>
