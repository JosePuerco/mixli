# Baut Mixli bei jedem Push auf main, lässt die Tests laufen und veröffentlicht auf GitHub Pages.
name: Deploy auf GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # erlaubt manuelles Starten im Tab „Actions“

permissions:
  contents: read
  pages: write
  id-token: write

# Nur ein Deployment gleichzeitig; ein laufendes wird nicht abgebrochen.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # Jede veröffentlichte Version muss ihren Tag haben (Ablauf siehe CLAUDE.md, „Versionen“).
      - name: Versions-Tag prüfen
        run: |
          TAG="v$(node -p "require('./package.json').version")"
          git fetch --depth=1 origin "refs/tags/$TAG:refs/tags/$TAG" || { echo "::error::Tag $TAG fehlt – vor dem Push 'npm version …' ausführen."; exit 1; }
          if [ "$(git rev-list -n 1 "$TAG")" != "$GITHUB_SHA" ]; then
            echo "::error::Tag $TAG zeigt nicht auf diesen Commit – neue Version mit 'npm version …' anlegen."
            exit 1
          fi

      - run: npm ci
      - run: npm test
      - run: npm run build

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
